name: Build feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; keeps cached YouTube data far below the 30-day limit
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the keepalive step re-enable this schedule

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v
      - name: Check API key
        id: key
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::YOUTUBE_API_KEY secret is not set yet; skipping feed build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build feed.json
        if: steps.key.outputs.ready == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python build_feed.py --out site/feed.json
      - uses: actions/configure-pages@v6
        if: steps.key.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.ready == 'true'
        with:
          path: site
      # GitHub pauses cron workflows in public repos after 60 days without commits.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
